<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; font-src 'self'; connect-src https://*.supabase.co https://cdn.jsdelivr.net; base-uri 'none'; form-action 'none'">
  <title>Researcher admin</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="admin.js"></script>
</head>
<body>
  <main class="container wide">
    <form class="block login" id="login-form" hidden>
      <h1>Researcher sign-in</h1>
      <label class="field">Email
        <input name="email" type="email" autocomplete="username" required>
      </label>
      <label class="field">Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="error" id="login-error" role="alert" hidden></p>
      <button class="button primary" type="submit">Sign in</button>
    </form>

    <div id="dashboard" hidden>
      <header class="admin-head">
        <h1 id="admin-title"></h1>
        <button class="button" type="button" id="sign-out">Sign out</button>
      </header>

      <p class="error" id="admin-error" role="alert" hidden></p>

      <section class="block" aria-label="Quota">
        <h2>Completed groups</h2>
        <div class="quota" id="quota"></div>
      </section>

      <form class="block" id="add-slot" novalidate>
        <h2>Add a timeslot</h2>
        <div class="slot-fields">
          <label class="field">Date <input name="date" inputmode="numeric" autocomplete="off" placeholder="DD/MM/YYYY" required></label>
          <label class="field">Start <input name="start" type="time" required></label>
          <label class="field">End <input name="end" type="time" required></label>
          <label class="field">Room <input name="room" required></label>
          <label class="field">Condition
            <select name="condition" required>
              <option value="" selected>—</option>
              <option value="2P">2P</option>
              <option value="3P">3P</option>
            </select>
          </label>
          <button class="button primary" type="submit">Add slot</button>
        </div>
      </form>

      <section class="block roster-block">
        <div class="roster-head">
          <h2>Roster</h2>
          <label class="check inline"><input type="checkbox" id="show-past"> <span>Show past days</span></label>
        </div>
        <div id="roster"></div>
      </section>
    </div>

    <p class="error" id="fatal" role="alert" hidden></p>
  </main>
</body>
</html>
